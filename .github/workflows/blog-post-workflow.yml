name: Latest blog post workflow

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  update-readme-with-blog:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@master

        with:

          feed_list: "https://joanndegwa.hashnode.dev/rss.xml"
          max_post_count: 5